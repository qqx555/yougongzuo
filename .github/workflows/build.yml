name: build-apk

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Locate project (支持整包 zip 或直接源码)
        run: |
          set -e
          if [ -f yougongzuo-src.zip ]; then unzip -q yougongzuo-src.zip -d _src; fi
          PROJ="$(dirname "$(find . -name settings.gradle.kts -not -path '*/build/*' | head -1)")"
          test -f "$PROJ/settings.gradle.kts"
          echo "PROJ=$PROJ" >> "$GITHUB_ENV"
          ls "$PROJ"

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Assemble debug APK
        working-directory: ${{ env.PROJ }}
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: yougongzuo-debug-apk
          path: ${{ env.PROJ }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
